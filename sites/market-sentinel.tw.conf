# market-sentinel.tw — default: everything goes to market-sentinel's own nginx
# (LIFF static files, SPA routing, /api/ → Django), unchanged. Extra apps on this
# hostname add a location file under routes/market-sentinel.tw/.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name market-sentinel.tw;

    ssl_certificate     /etc/letsencrypt/live/market-sentinel.tw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/market-sentinel.tw/privkey.pem;

    # Must be >= market-sentinel's own limit (10M) or uploads 413 here first.
    client_max_body_size 10M;

    include /etc/nginx/routes/market-sentinel.tw/*.conf;

    # ms-nginx only redirects on :80, so talk to its :443 with the right SNI.
    # Its cert isn't verified on this internal hop (edge owns renewal now).
    location / {
        set $up https://ms-nginx:443;
        include /etc/nginx/snippets/proxy.conf;
        proxy_ssl_server_name on;
        proxy_ssl_name        market-sentinel.tw;
        proxy_ssl_verify      off;
        proxy_pass $up;
    }
}
