# Shared http-level settings. App-specific config belongs in sites/ and routes/.

# Docker's embedded DNS. Upstreams are always `set $up ...; proxy_pass $up;`
# so names resolve per request: edge starts and stays up even when an app is down
# (that route returns 502 until the app is back).
resolver 127.0.0.11 valid=10s ipv6=off;

server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;

# Port 80 for every host: ACME http-01 challenges, everything else → https.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 443 for hostnames we don't serve: refuse the TLS handshake.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

include /etc/nginx/sites/*.conf;
