# insurance-mcp (MCP Streamable HTTP) mounted at market-sentinel.tw/mcp.
# The app checks Bearer auth and the Host header itself.
location = /mcp {
    set $up http://insurance-mcp:8000;
    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/proxy-stream.conf;
    proxy_pass $up;
}
